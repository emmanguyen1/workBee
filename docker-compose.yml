services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hivework
      POSTGRES_PASSWORD: hivework
      POSTGRES_DB: hivework
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivework -d hivework"]
      interval: 5s
      timeout: 3s
      retries: 10
  queen:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://hivework:hivework@postgres:5432/hivework
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
  careers-queen:
    build: .
    env_file: .env
    environment:
      HIVE_CONFIG: hives/careers/hive.yml
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://hivework:hivework@postgres:5432/hivework
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
  dashboard:
    build: .
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://hivework:hivework@postgres:5432/hivework
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
    restart: unless-stopped
  workbee:
    build: .
    command: ["uvicorn", "hives.careers.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      WORKBEE_OPENAI_API_KEY: ${WORKBEE_OPENAI_API_KEY:-}
      WORKBEE_AI_MODEL: ${WORKBEE_AI_MODEL:-gpt-5-mini}
      DATABASE_URL: postgresql://hivework:hivework@postgres:5432/hivework
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8001:8001"]
    restart: unless-stopped
  redis-bridge:
    build: .
    command: ["uvicorn", "dashboard.bridge:app", "--host", "0.0.0.0", "--port", "8765"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8765:8765"]
    restart: unless-stopped
volumes:
  postgres_data:
