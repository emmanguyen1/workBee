services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hivework
      POSTGRES_PASSWORD: hivework
      POSTGRES_DB: hivework
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivework -d hivework"]
      interval: 5s
      timeout: 3s
      retries: 10
  queen:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://hivework:hivework@postgres:5432/hivework
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
  dashboard:
    build: .
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://hivework:hivework@postgres:5432/hivework
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
    restart: unless-stopped
volumes:
  postgres_data:
